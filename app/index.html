/* ---------- criptografia (os registros saem do aparelho já embaralhados) ---------- */
const ITER=250000;const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{let s="";const a=new Uint8Array(u);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const aleat=n=>crypto.getRandomValues(new Uint8Array(n));
const hex=u=>[...u].map(x=>x.toString(16).padStart(2,"0")).join("");
async function kek(senha,salt,iter){const base=await crypto.subtle.importKey("raw",te.encode(senha),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function embrulhar(raw,senha){const salt=aleat(16),iv=aleat(12);const k=await kek(senha,salt,ITER);
  const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,raw);return{salt:b64(salt),iv:b64(iv),it:ITER,c:b64(c)}}
async function desembrulhar(w,senha){if(!w||!w.c)return null;try{const k=await kek(senha,unb64(w.salt),w.it||ITER);
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(w.iv)},k,unb64(w.c)))}catch(e){return null}}
const chaveDe=raw=>crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"]);
async function cifrar(obj,key){const iv=aleat(12);const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},key||BD.key,te.encode(JSON.stringify(obj)));return{iv:b64(iv),c:b64(c)}}
async function decifrar(d,key){const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(d.iv)},key||BD.key,unb64(d.c));return JSON.parse(td.decode(p))}

function telaFlow(){
  const f=S.flow;
  if(f.feito)return telaFeito();
  const passos=f.tipo==="checkin"?passosCheckin(f.d):passosAbc(f.d);const p=passos[f.passo];const ultimo=f.passo===passos.length-1;
  const sair=()=>{S.flow=null;render(true)};
  return h("div",null,h("main",{class:"wrap"},
    h("div",{class:"row between"},h("span",{class:"eyebrow",text:(f.tipo==="checkin"?"Check-in":"Registro ABC")+" · passo "+(f.passo+1)+" de "+passos.length}),
      h("button",{class:"btn ghost",onclick:sair},"Fechar")),
    h("div",{class:"progress"},h("i",{style:"width:"+((f.passo+1)/passos.length*100)+"%"})),
    f.retomado&&f.passo===0?h("div",{class:"card soft"},h("p",{class:"small",text:"Continuando de onde você parou."}),
      h("button",{class:"btn ghost",style:"align-self:flex-start;padding-left:0",onclick:()=>{ls.del("rascunho-"+f.tipo);S.flow=novoFlow(f.tipo);render(true)}},"Começar do zero")):null,
    h("h1",{text:p.t}),h("p",{class:"muted",text:p.a}),p.r()),
    h("div",{class:"footer"},h("div",{class:"in"},
      f.passo>0?h("button",{class:"btn",onclick:()=>{f.passo--;mudou();window.scrollTo(0,0)}},"Voltar"):null,
      ultimo?h("button",{class:"btn primary",disabled:f.salvando||null,onclick:finalizar},f.salvando?"Salvando…":"Salvar")
            :h("button",{class:"btn primary",onclick:()=>{f.passo++;mudou();window.scrollTo(0,0)}},"Próximo"))));
}
async function finalizar(){
  const f=S.flow;f.salvando=true;render(true);
  const agora=new Date();let dia=diaLocal(agora);
  if(f.tipo==="abc"&&f.d.quando==="Ontem")dia=diaLocal(new Date(agora.getTime()-864e5));
  const doc=Object.assign({tipo:f.tipo,quem:"ela",criadoEm:agora.toISOString(),dia},JSON.parse(JSON.stringify(f.d)));
  if(doc.nota)doc.nota=doc.nota.slice(0,1500);
  try{await salvar("registros",doc);ls.del("rascunho-"+f.tipo);if(f.tipo==="checkin")avisarCheckinFeito();
    const risco=(f.tipo==="checkin"&&f.d.seguranca===2)||(f.tipo==="abc"&&f.d.c.comportamentos.includes("Vontade de me machucar"));
    S.flow={tipo:f.tipo,feito:true,risco}}
  catch(e){f.salvando=false;render(true);toast("Não consegui salvar. Seu registro continua guardado aqui; tente de novo.")}
  render(true);window.scrollTo(0,0);
}
function telaFeito(){const f=S.flow;

    f.risco?contatos():null,
    h("div",{class:"row"},h("button",{class:"btn primary",onclick:()=>{S.flow=null;S.view="inicio";render(true)}},"Voltar ao início"),

}

render(true);
